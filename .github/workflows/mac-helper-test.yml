name: Build Mac helper for testing
on:
  push:
    branches: [main, codex/mac-helper-test-build]
    paths:
      - '.github/workflows/mac-helper-test.yml'
      - 'tools/creatyv-mac-helper/**'
      - 'mint-more-frontend/src/components/services/aiEditor/HelperEditor.jsx'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build unsigned helper
        working-directory: tools/creatyv-mac-helper
        run: node scripts/build-mac-helper.mjs
      - name: Verify helper starts and accepts Creatyv requests
        working-directory: tools/creatyv-mac-helper
        shell: bash
        run: |
          app="dist/creatyv-helper-mac-$(node -p process.arch)/Creatyv Helper.app"
          "$app/Contents/MacOS/creatyv-helper" > /tmp/creatyv-helper.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent -H 'Origin: https://mintmore.vercel.app' http://127.0.0.1:4321/api/hello > /tmp/creatyv-hello.json; then break; fi
            sleep 1
          done
          if [ ! -s /tmp/creatyv-hello.json ]; then cat /tmp/creatyv-helper.log; exit 1; fi
          node -e "const a=require('/tmp/creatyv-hello.json'); if(a.app!=='creatyv-helper') process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: creatyv-helper-${{ matrix.runner }}
          path: tools/creatyv-mac-helper/dist/**/*.zip
          if-no-files-found: error
          retention-days: 7
  publish-downloads:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: creatyv-helper-macos-*
          path: mac-downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-helper-latest
          name: Creatyv Helper for Mac (Testing)
          body: |
            Unsigned Mac test builds for Creatyv AI editing.

            Choose the archive that matches your Mac:
            - `CreatyvHelper-arm64.zip` for Apple silicon (M1, M2, M3, M4).
            - `CreatyvHelper-x64.zip` for Intel Macs.

            These builds are unsigned and not notarized. They are for testing and may require allowing the app in macOS Privacy & Security settings. Full AI editing still needs to be tested on a Mac.
          prerelease: true
          make_latest: false
          files: mac-downloads/**/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true
